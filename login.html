<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body>

<section class="d-flex flex-column justify-content-center align-items-center">
    <article class="logo">
        <img src="images/Logo.png" alt="Логотип">
    </article>
    <article>
        <article class="login-title text-center fs-1 --bs-blue-900"><h2>Вход</h2></article>
        <article class="inputs-and-check d-flex flex-column gap-2">
            <input type="text" class="rounded pt-1 pb-1 secondary border-white" placeholder = "Электронная почта">
            <input type="text" class="rounded pt-1 pb-1 secondary border-white" placeholder = "Пароль">
            <article>
                <input type="checkbox" id="agree" required>
                <label for="remember">
                    Запомнить меня
                </label>
            </article>
        </article>
        <button class="mt-4 mb-2 btn bg-primary text-white w-100">Войти</button>
        <section class="form-link">Еще нет аккаунта? <a href="#" class="primary">Пройдите регистрацию</a></section>
    </article>
</section>

<script src="js/bootstrap.min.js"></script>
</body>
</html>
